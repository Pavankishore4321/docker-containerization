# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy Config — Full Stack
# Routes: / → Angular container, /api/ → Spring Boot container
# Project: AspTax (Incresol Software Services)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen      80;
    server_name localhost;

    # ── HEALTH CHECK ─────────────────────────────────────────────────────────
    location /health {
        access_log  off;
        return      200 "OK\n";
        add_header  Content-Type text/plain;
    }

    # ── API ROUTES → Spring Boot ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://springboot:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── FRONTEND → Angular ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://angular:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── GZIP ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Hide Nginx version
    server_tokens off;
}
