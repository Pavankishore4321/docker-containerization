# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose: MongoDB 3-Node Replica Set
# Project: Node Application High-Availability (Incresol Software Services)
# Setup:   1 Primary + 1 Secondary + 1 Arbiter
#
# Usage:
#   docker-compose -f docker-compose-mongo-replica.yml up -d
#   docker-compose -f docker-compose-mongo-replica.yml exec mongo-primary mongosh
#
# After starting, initiate replica set (one time only):
#   docker exec -it mongo-primary mongosh --eval "
#     rs.initiate({
#       _id: 'rs0',
#       members: [
#         { _id: 0, host: 'mongo-primary:27017',   priority: 2 },
#         { _id: 1, host: 'mongo-secondary:27017', priority: 1 },
#         { _id: 2, host: 'mongo-arbiter:27017',   arbiterOnly: true }
#       ]
#     })
#   "
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

networks:
  mongo-network:
    driver: bridge

volumes:
  mongo-primary-data:   {}
  mongo-secondary-data: {}

services:

  # ── PRIMARY NODE ─────────────────────────────────────────────────────────────
  mongo-primary:
    image: mongo:6.0
    container_name: mongo-primary
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo-primary-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: changeme       # Change before use
    networks:
      mongo-network:
        aliases:
          - mongo-primary
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── SECONDARY NODE ───────────────────────────────────────────────────────────
  mongo-secondary:
    image: mongo:6.0
    container_name: mongo-secondary
    restart: unless-stopped
    ports:
      - "27018:27017"
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo-secondary-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: changeme
    networks:
      mongo-network:
        aliases:
          - mongo-secondary
    depends_on:
      - mongo-primary
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── ARBITER NODE ─────────────────────────────────────────────────────────────
  # Arbiter participates in elections but stores NO data
  # Lightweight — resolves split-brain in 2-node setups
  mongo-arbiter:
    image: mongo:6.0
    container_name: mongo-arbiter
    restart: unless-stopped
    ports:
      - "27019:27017"
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    networks:
      mongo-network:
        aliases:
          - mongo-arbiter
    depends_on:
      - mongo-primary
      - mongo-secondary

  # ── REPLICA SET INITIALIZER ───────────────────────────────────────────────
  # Runs once to initiate the replica set, then exits
  mongo-init:
    image: mongo:6.0
    container_name: mongo-init
    restart: "no"
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary:
        condition: service_healthy
    networks:
      - mongo-network
    command: >
      mongosh --host mongo-primary:27017
        -u mongoadmin -p changeme --authenticationDatabase admin
        --eval '
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo-primary:27017",   priority: 2 },
              { _id: 1, host: "mongo-secondary:27017", priority: 1 },
              { _id: 2, host: "mongo-arbiter:27017",   arbiterOnly: true }
            ]
          });
          print("Replica set initiated");
          rs.status();
        '
