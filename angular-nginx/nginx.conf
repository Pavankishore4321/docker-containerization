# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration: Angular SPA
# Project: AspTax, P-Collab (Incresol Software Services)
# Purpose: Serve Angular build, handle client-side routing, gzip, security
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── ANGULAR ROUTING ──────────────────────────────────────────────────────
    # Angular uses client-side routing — all routes must return index.html
    # Without this, refreshing /dashboard would give a 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── HEALTH CHECK ENDPOINT ────────────────────────────────────────────────
    location /health {
        access_log  off;
        return      200 "healthy\n";
        add_header  Content-Type text/plain;
    }

    # ── STATIC ASSET CACHING ─────────────────────────────────────────────────
    # Angular generates hashed filenames (main.abc123.js) — safe to cache 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires             1y;
        add_header          Cache-Control "public, immutable";
        access_log          off;
    }

    # ── GZIP COMPRESSION ─────────────────────────────────────────────────────
    # Reduces file sizes — faster load times
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1000;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── SECURITY HEADERS ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"           always;
    add_header X-XSS-Protection       "1; mode=block"        always;
    add_header X-Content-Type-Options "nosniff"              always;
    add_header Referrer-Policy        "strict-origin"        always;

    # ── HIDE NGINX VERSION ────────────────────────────────────────────────────
    server_tokens off;

    # ── ERROR PAGES ───────────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
